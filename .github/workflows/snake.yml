name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235EEAD4&color_dots=%23ebedf0,%230E4C5C,%231B8A94,%232F9E5C,%233ddc84
            dist/github-contribution-grid-snake-dark.svg?color_snake=%235EEAD4&color_dots=%23161b22,%230E4C5C,%231B8A94,%232F9E5C,%233ddc84

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
